name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: boilerpilate_test
          POSTGRES_USER: boilerpilate
          POSTGRES_PASSWORD: boilerpilate
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U boilerpilate -d boilerpilate_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_pgsql, intl, zip
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Create test database
        env:
          PGPASSWORD: boilerpilate
        run: |
          psql -h 127.0.0.1 -U boilerpilate -d boilerpilate_test -c 'SELECT 1' || true

      - name: PHP CS Fixer
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

      - name: PHPStan
        run: vendor/bin/phpstan analyse

      - name: Pest
        env:
          APP_ENV: test
          DATABASE_URL: postgresql://boilerpilate:boilerpilate@127.0.0.1:5432/boilerpilate_test?serverVersion=16&charset=utf8
          CACHE_URL: redis://127.0.0.1:6379
          APP_SECRET: test_secret_not_for_production_use
        run: vendor/bin/pest
